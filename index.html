<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/Computational-Geometry-2627/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>geom-project: Boundary Guarding (Ashur et al. 2022)</title>
    <script type="module" crossorigin src="/Computational-Geometry-2627/assets/index-b7ZfcNOB.js"></script>
    <link rel="stylesheet" crossorigin href="/Computational-Geometry-2627/assets/index-BvzE2NPA.css">
  </head>
  <body>
    <div id="app">
      <header id="toolbar">
        <div class="instructions">
          <span><strong>Double-click:</strong> add vertex</span>
          <span><strong>Right-click vertex:</strong> delete</span>
          <span><strong>Drag:</strong> move</span>
        </div>
        <div class="controls">
          <button id="btn-compute-guards" class="btn primary">Compute ∂P Guards</button>
          <button id="btn-triangulate" class="btn">Triangulate</button>
          <button id="btn-clear-overlays" class="btn">Clear</button>

          <label class="toggle-label live-toggle">
            <input type="checkbox" id="toggle-live" checked />
            <span><strong>Live Updates</strong></span>
          </label>
          <label class="toggle-label">
            <input type="checkbox" id="toggle-cuts" />
            <span>Show Cuts (B)</span>
          </label>
          <label class="toggle-label">
            <input type="checkbox" id="toggle-witnesses" checked />
            <span>Show Witnesses (W)</span>
          </label>
          <label class="toggle-label">
            <input type="checkbox" id="toggle-sightlines" />
            <span>Show Guard Sightlines</span>
          </label>
        </div>
      </header>

      <main id="canvas-container">
        <canvas id="canvas"></canvas>
      </main>

      <footer id="status-bar">
        <span id="coords-display">coords: (0, 0)</span>
        <span id="status-info">Ready. Press "Compute ∂P Guards" or press 'G'.</span>
      </footer>
    </div>
  </body>
</html>
